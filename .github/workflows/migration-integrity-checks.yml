name: Migration integrity checks
on:
  pull_request:
    paths:
      - 'migration-checks/**'
      - '.github/workflows/migration-integrity-checks.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test migration-checks/*.test.mjs
