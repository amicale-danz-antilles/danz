name: Déployer le site sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Installer les dépendances
        run: npm install --no-fund --no-audit
      - name: Bloquer un déploiement avec vulnérabilité haute
        run: npm audit --audit-level=high
      - name: Construire l'application
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://axewfeanyfxkzercafen.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_MknXpC-LmMbjHfv2ALiVag_km2DNMMw
      - uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v5.0.1
