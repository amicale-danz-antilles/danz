name: Déployer le site sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Installer les dépendances
        run: npm install --no-fund --no-audit
      - name: Bloquer un déploiement avec vulnérabilité haute
        run: npm audit --audit-level=high
      - name: Construire l'application
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://axewfeanyfxkzercafen.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_MknXpC-LmMbjHfv2ALiVag_km2DNMMw
      - name: Vérifier les fichiers de production
        run: npm run verify:production
      - uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v5.0.1
  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5
    steps:
      - name: Vérifier le site publié
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"

          fetch_with_retry() {
            local url="$1"
            local out="$2"
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --location --max-time 20 "$url" -o "$out"; then
                return 0
              fi
              echo "Tentative $attempt échouée pour $url, nouvel essai dans 5 s..."
              sleep 5
            done
            return 1
          }

          fetch_with_retry "$base/" /tmp/danz-index.html
          fetch_with_retry "$base/manifest.webmanifest" /tmp/danz-manifest.json
          fetch_with_retry "$base/sw.js" /tmp/danz-sw.js
          fetch_with_retry "$base/image001-1.png" /tmp/danz-logo.png
          fetch_with_retry "$base/favicon-v8.png" /tmp/danz-favicon.png

          grep -q "Amicale DANZ Antilles" /tmp/danz-index.html
          grep -q "icon-192-v8.png" /tmp/danz-manifest.json
          grep -q "danz-shell-v21" /tmp/danz-sw.js
          test -s /tmp/danz-logo.png
          test -s /tmp/danz-favicon.png
          echo "Smoke test production réussi : page, PWA, service worker et identité visuelle sont accessibles."
