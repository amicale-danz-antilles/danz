name: Vérifier le prototype Cloudflare D1 (sans données réelles)
on:
  push:
    branches:
      - cloudflare/danz-api-preparation
    paths:
      - "workers/danz-api/**"
      - ".github/workflows/danz-d1-staging-check.yml"
  pull_request:
    branches:
      - cloudflare/danz-api-preparation
    paths:
      - "workers/danz-api/**"
      - ".github/workflows/danz-d1-staging-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier la syntaxe du Worker
        run: node --check workers/danz-api/src/index.mjs
      - name: Exécuter les tests du Worker et les contrôles de migration fictive
        run: node --test
        working-directory: workers/danz-api
      - name: Vérifier la parité du transfert fictif vers SQLite
        run: node migration/dry-run.mjs
        working-directory: workers/danz-api
      - name: Restaurer les fixtures PostgreSQL dans un conteneur sans réseau
        working-directory: workers/danz-api
        run: |
          docker pull postgres@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
          node migration/restore-synthetic-postgres.mjs
