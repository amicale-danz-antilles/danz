name: Cloudflare frontend packaging
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'supabase/functions/**'
      - 'index.html'
      - 'vite.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloudflare-frontend-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run test:cloudflare
      - run: npm run test:security
      - run: npm run build:cloudflare
        env:
          VITE_SUPABASE_URL: https://axewfeanyfxkzercafen.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_MknXpC-LmMbjHfv2ALiVag_km2DNMMw
      - run: test -f cloudflare-dist/danz/index.html && test -f cloudflare-dist/danz/sw.js && test -f cloudflare-dist/_redirects
      - run: npm run test:treasury && npm run test:treasury:v2
